name: Test

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - 'apps/web/content/docs/**'
      - 'deploy/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pubky_pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        env:
          # setup.ts hardcodes `postgres://localhost:5432/pubky_pulse_test`
          # with no user in the URL. PGUSER=postgres lets postgres-js fall back
          # to the default postgres superuser (created by the service container).
          # PGHOST=localhost steers psql off the Unix-socket default path.
          # With POSTGRES_HOST_AUTH_METHOD=trust, no password is needed.
          PGUSER: postgres
          PGHOST: localhost
          DATABASE_URL: postgres://postgres@localhost:5432/pubky_pulse_test
          JWT_SECRET: test-secret
          HOST: 127.0.0.1
          # Identity configuration is required — apps/server/src/config.ts
          # validates it at module load. These mirror the values in
          # apps/server/vitest.config.ts and the domains the fixtures use.
          PULSE_ALLOWED_EMAIL_DOMAINS: pulse.pubky.org,example.com
          PULSE_TEAM_OWNER_EMAIL: test@pulse.pubky.org
          PULSE_DEFAULT_TEAM_SLUG: test-team
          PULSE_DEFAULT_TEAM_NAME: Test Team
        run: pnpm test
